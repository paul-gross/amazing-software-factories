name: Daily screen

# Nominate from GH Archive and the lists, screen layers 1 and 2 into the waiting list, keep the week's snapshot on
# Mondays, and push (context/run-cycle.md). It runs at 06:00 UTC, the hour the hourly cycle skips. The screen saves as it goes under .cache/, which is carried between runs, so one cut
# off by the time limit continues where it stopped when run again.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cycle
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: |
            .cache
            !.cache/clones
          key: screen-${{ github.run_id }}
          restore-keys: screen-
      - name: Unit tests
        run: python -m unittest discover -s tests -q
      - name: Find and screen
        run: nice -n 15 python -u -m asf daily
        env:
          # The bot's credentials: the code mints its installation token and mints it again before the hour runs out.
          ASF_APP_ID: ${{ secrets.ASF_APP_ID }}
          ASF_APP_PRIVATE_KEY: ${{ secrets.ASF_APP_PRIVATE_KEY }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            .cache
            !.cache/clones
          key: screen-${{ github.run_id }}
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/publish.sh "data: daily screen $(date -u +%F)"
